{% if page.has_other_pages %}<nav class="p-3"><ul class="pagination mb-0">{% if page.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.kind %}&kind={{ request.GET.kind|urlencode }}{% endif %}{% if request.GET.pincode %}&pincode={{ request.GET.pincode|urlencode }}{% endif %}{% if request.GET.action %}&action={{ request.GET.action|urlencode }}{% endif %}">Previous</a></li>{% endif %}<li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>{% if page.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.kind %}&kind={{ request.GET.kind|urlencode }}{% endif %}{% if request.GET.pincode %}&pincode={{ request.GET.pincode|urlencode }}{% endif %}{% if request.GET.action %}&action={{ request.GET.action|urlencode }}{% endif %}">Next</a></li>{% endif %}</ul></nav>{% endif %}
