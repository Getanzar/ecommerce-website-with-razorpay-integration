{% extends "base.html" %}{% block title %}Pay for grocery order{% endblock %}{% block content %}<div class="container py-5 text-center"><h1 class="h3">Complete your payment</h1><p>Order #{{ order.id }} · ₹{{ order.total }}</p><button id="pay" class="btn btn-success btn-lg">Pay securely</button></div><form id="confirm" method="post" action="{% url 'grocery_payment_confirm' order.id %}">{% csrf_token %}<input type="hidden" name="razorpay_order_id"><input type="hidden" name="razorpay_payment_id"><input type="hidden" name="razorpay_signature"></form><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.getElementById('pay').onclick=()=>new Razorpay({key:'{{ razorpay_key_id }}',amount:{{ order.total|stringformat:"f" }}*100,currency:'INR',order_id:'{{ order.razorpay_order_id }}',name:'ZIYAMART Grocery',handler:p=>{const f=document.getElementById('confirm');Object.keys(p).forEach(k=>f.elements[k].value=p[k]);f.submit()}}).open()</script>{% endblock %}
