<div class="pack-row border rounded-3 p-3 mb-3" data-pack-row>{{ pack.id }}{{ pack.product }}<div hidden>{{ pack.DELETE }}</div>{{ pack.non_field_errors }}<div class="row g-3">{% for field in pack.visible_fields %}{% if field.name != 'DELETE' %}<div class="col-6 col-md-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endif %}{% endfor %}</div><button type="button" class="btn btn-outline-danger btn-sm mt-3" data-remove-pack>Remove size</button></div>
