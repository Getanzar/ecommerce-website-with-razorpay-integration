{% extends "base.html" %}
{% block title %}Set new password | ZIYAMART{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3">Choose a new password</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-dark w-100">Save new password</button></form>
</div></div></div></div></div>
{% endblock %}
