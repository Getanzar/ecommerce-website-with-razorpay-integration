{% extends "base.html" %}
{% block title %}Verify reset code | ZIYAMART{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3">Check your email</h1><p class="text-muted">Enter the six-digit code sent to {{ email }}. It expires in 10 minutes.</p>
<form method="post">{% csrf_token %}<label class="form-label" for="otp">Verification code</label><input id="otp" name="otp" class="form-control mb-3" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="btn btn-dark w-100">Verify code</button></form>
<form method="post" action="{% url 'password_reset_resend' %}" class="text-center mt-3">{% csrf_token %}<button type="submit" class="btn btn-link">Resend code</button></form>
</div></div></div></div></div>
{% endblock %}
