{% extends "dashboard/seller/base.html" %}{% block title %}Restaurant setup{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><h1 class="h3">Restaurant settings</h1><p class="text-muted">Choose every pincode where your restaurant delivers.</p><form method="post" enctype="multipart/form-data" class="card"><div class="card-body">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save restaurant</button></div></form></div></div><script>document.querySelectorAll('input:not([type=checkbox]),textarea,select').forEach(el=>el.classList.add('form-control'))</script>{% endblock %}
