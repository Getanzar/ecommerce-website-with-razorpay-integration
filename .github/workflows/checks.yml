name: Backend and mobile checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      SECRET_KEY: ci-test-key-not-for-production
      DEBUG: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=config.test_settings
      - name: Production security configuration
        env:
          RENDER: 'true'
          SECRET_KEY: ci-only-placeholder-72f5b829c6e04dc1a8b73d519ef0624a-configuration-check
        run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python manage.py test --settings=config.test_settings --noinput
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:android
      - run: pnpm exec expo export --platform ios --output-dir dist-ios-check
